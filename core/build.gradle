plugins {
    alias libs.plugins.gradleup.shadow
    alias libs.plugins.intershop.gradle.javacc
    id 'java'
    id 'com.jfrog.artifactory'
    id 'maven-publish'
    id 'signing'
}

apply plugin: 'jacoco'


repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation platform(libs.jackson.bom)
    implementation libs.jackson.databind

    testImplementation libs.junit
    testImplementation libs.jackson.dataformat.yaml
}

ext {
    timestamp = new Date().format('yyyyMMddHHmm')
    // Configuration Cache-safe Git resolution
    gitrev = providers.exec {
        commandLine 'git', 'log', '-1', 'HEAD', '--pretty=tformat:%h'
    }.standardOutput.asText.map { it.trim() }.get()
}

group 'com.schibsted.spt.data'
version "0.1.14"
project.description "A JSON query and transformation language"

check {
    doLast {
        println 'Test report in build/reports/tests/test/index.html'
    }
}

// ===========================================================================
// javacc integration
javacc {
    javaCCVersion = '7.0.13'
    configs {
        jsltParser {
            inputFile = file('src/main/jjtree/jslt.jjt')
            packageName = 'com/schibsted/spt/data/jslt/parser'
            jdkVersion = java.targetCompatibility.toString()
            jjtree {
                staticParam = false;
                trackTokens = true;
            }
            buildParser = true;
            buildTokenManager = true;
            sanityCheck = true;
            unicodeInput = true;
        }
    }
}

// ===========================================================================
// Sonatype Maven central publishing

tasks.register("sourceJar", Jar) {
    archiveClassifier.set("sources")
    from sourceSets.main.allJava
}

// declaring this separately to avoid including javacc-generated sources
// because javadoc fail on those
sourceSets {
    javadoc {
        java {
            srcDirs 'src/main/java'
        }
    }
}

javadoc {
    source = sourceSets.javadoc.allJava
}

tasks.register("javadocJar", Jar) {
    archiveClassifier.set("javadoc")
    from javadoc.destinationDir
    dependsOn(javadoc)
}

artifacts {
    archives jar
    archives sourceJar
    archives javadocJar
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            groupId = group
            artifactId = 'jslt'
            version = project.provider { version.toString() }.get()

            pom {
                name = 'JSLT'
                description = project.description
                url = 'https://github.com/schibsted/jslt'
                organization {
                    name = 'Schibsted ASA'
                    url = 'https://github.com/schibsted/'
                }
                issueManagement {
                    system = 'GitHub'
                    url = 'https://github.com/schibsted/jslt/issues'
                }
                licenses {
                    license {
                        name = 'Apache License 2.0'
                        url = 'https://github.com/schibsted/jslt/blob/master/LICENSE'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        name = 'Schibsted'
                    }
                }
                scm {
                    url = 'https://github.com/schibsted/jslt'
                    connection = 'scm:git:git://github.com/schibsted/jslt.git'
                    developerConnection = 'scm:git:ssh://git@github.com:schibsted/jslt.git'
                }
            }

            from components.java

            artifact(tasks.named('sourceJar')) {
                classifier = 'sources'
            }
            artifact(tasks.named('javadocJar')) {
                classifier = 'javadoc'
            }
        }
    }
    repositories {
        maven {
            url "https://oss.sonatype.org/service/local/staging/deploy/maven2"
            credentials {
                // these are stored in a secret gradle.properties that is not
                // in the repo, so we need a fallback
                username = project.providers.gradleProperty('sonatypeUsername').getOrElse('no username')
                password = project.providers.gradleProperty('sonatypePassword').getOrElse('no password')
            }
        }
    }
}

signing {
    required { gradle.taskGraph.hasTask("publish") }
    sign publishing.publications.mavenJava
}


model {
    tasks.generatePomFileForMavenJavaPublication {
        destination = file("$buildDir/generated-pom.xml")
    }
}


test {
    testLogging {
        showStandardStreams = true
    }
    jvmArgs '-Duser.language=en'
}